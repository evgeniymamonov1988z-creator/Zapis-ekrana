name: Build Windows EXE

# Automatic, reproducible build from source.
# Produces the ScreenRecorder.exe artifact that SignPath can sign.

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build single-file EXE
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name ScreenRecorder
          --icon mamonov_icon.ico
          --add-data "updater.pyw;."
          --add-data "mamonov_icon.ico;."
          screen_recorder.pyw

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder
          path: dist/ScreenRecorder.exe
          if-no-files-found: error
