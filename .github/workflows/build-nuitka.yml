name: Build Windows EXE (Nuitka)
# build trigger: 2026-10-15 permanent-sign

# Сборка .exe через Nuitka на Windows.
# Nuitka компилирует Python в настоящий машинный код —
# это часто даёт меньше ложных срабатываний антивирусов, чем PyInstaller.

on:
  workflow_dispatch:        # кнопка "Запустить" вручную
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka==2.4.8
          pip install -r requirements.txt

      - name: Build EXE with Nuitka
        shell: pwsh
        run: |
          $args = @(
            '--standalone',
            '--assume-yes-for-downloads',
            '--windows-console-mode=disable',
            '--enable-plugin=tk-inter',
            '--windows-icon-from-ico=mamonov_icon.ico',
            # Metadata inside the .exe (empty fields look suspicious to AV)
            '--company-name=Evgeniy Mamonov',
            '--product-name=Ekrannik (Screen Recorder)',
            '--file-description=Ekrannik - Screen Recorder by Evgeniy Mamonov',
            '--file-version=1.0.0.0',
            '--product-version=1.0.0.0',
            '--copyright=Copyright (c) Evgeniy Mamonov. All rights reserved.',
            '--trademarks=Ekrannik (TM) Evgeniy Mamonov',
            '--include-data-files=updater.pyw=updater.pyw',
            '--include-data-files=mamonov_icon.ico=mamonov_icon.ico',
            '--output-filename=Ekrannik.exe',
            '--output-dir=dist'
          )
          # PyAudioWPatch импортируется лениво внутри функций — форсируем включение
          # всего пакета, иначе Nuitka не положит его в сборку (нужен для звука: микрофон + системный).
          python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('pyaudiowpatch') else 1)"
          if ($LASTEXITCODE -eq 0) {
            Write-Host '[OK] PyAudioWPatch (звук) будет включён'
            $args += '--include-package=pyaudiowpatch'
          } else {
            Write-Host '[i] pyaudiowpatch не найден — пропускаю (запись пойдёт без звука)'
          }
          if (Test-Path 'bin\ffmpeg.exe') {
            Write-Host '[OK] ffmpeg.exe будет встроен в .exe'
            $args += '--include-data-dir=bin=bin'
          } else {
            Write-Host '[i] ffmpeg.exe нет в bin\ — программа скачает его при первом запуске'
          }
          python -m nuitka @args screen_recorder.pyw

      - name: Rename folder and main EXE to Russian demo name
        shell: pwsh
        run: |
          # Nuitka standalone кладёт результат в dist\screen_recorder.dist
          $distDir = 'dist\screen_recorder.dist'
          if (-not (Test-Path $distDir)) {
            Write-Host '[!] Папка сборки не найдена:' $distDir
            Get-ChildItem dist | Select-Object -First 30
            exit 1
          }
          # Переименуем папку в имя бренда
          Rename-Item -LiteralPath $distDir -NewName 'Ekrannik' -Force
          $newDir = 'dist\Ekrannik'
          Write-Host ('[OK] ' + $newDir + '\Ekrannik.exe')

      - name: Sign main EXE with own certificate
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfxBytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:SIGN_PFX_PASSWORD, 'Exportable,PersistKeySet')
          $exe = Get-ChildItem 'dist\Ekrannik\*.exe' | Select-Object -First 1
          $sig = Set-AuthenticodeSignature -FilePath $exe.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host ('[OK] Signed: ' + $exe.FullName + ' -> ' + $sig.Status)

      - name: Make FULL package (secret link)
        shell: pwsh
        run: |
          # ПОЛНАЯ версия (для секретной ссылки покупателя): папка БЕЗ demo.flag.
          Compress-Archive -Path 'dist\Ekrannik' -DestinationPath 'dist\Ekrannik-Full.zip' -Force
          Write-Host '[OK] dist\Ekrannik-Full.zip (полная версия, без ограничений)'

      - name: Build FULL installer with Inno Setup
        shell: pwsh
        run: |
          # Установщик ПОЛНОЙ версии — собираем из папки, пока в ней ЕЩЁ НЕТ demo.flag.
          $exeName = 'Ekrannik.exe'
          $appTitle = 'Ekrannik'
          $lines = @(
            '[Setup]',
            "AppName=$appTitle",
            'AppVersion=1.0.0',
            'AppPublisher=Evgeniy Mamonov',
            'DefaultDirName={autopf}\Ekrannik',
            "DefaultGroupName=$appTitle",
            'DisableProgramGroupPage=yes',
            "UninstallDisplayIcon={app}\$exeName",
            'OutputDir=dist',
            'OutputBaseFilename=Ekrannik-Full-Setup',
            'SetupIconFile=dist\Ekrannik\mamonov_icon.ico',
            'Compression=lzma2',
            'SolidCompression=yes',
            'WizardStyle=modern',
            'PrivilegesRequired=lowest',
            '',
            '[Languages]',
            'Name: "en"; MessagesFile: "compiler:Default.isl"',
            'Name: "ru"; MessagesFile: "compiler:Languages\Russian.isl"',
            '',
            '[Tasks]',
            'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"',
            '',
            '[InstallDelete]',
            'Type: files; Name: "{app}\demo.flag"',
            '',
            '[Files]',
            'Source: "dist\Ekrannik\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs',
            '',
            '[Icons]',
            "Name: `"{group}\$appTitle`"; Filename: `"{app}\$exeName`"",
            "Name: `"{autodesktop}\$appTitle`"; Filename: `"{app}\$exeName`"; Tasks: desktopicon",
            '',
            '[Run]',
            "Filename: `"{app}\$exeName`"; Description: `"{cm:LaunchProgram,$appTitle}`"; Flags: nowait postinstall skipifsilent"
          )
          $iss = $lines -join "`r`n"
          $utf8bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText("$PWD\installer-full.iss", $iss, $utf8bom)
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host '[i] Inno Setup не найден — ставлю через choco'
            choco install innosetup -y --no-progress
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          & $iscc 'installer-full.iss'
          if ($LASTEXITCODE -ne 0) { Write-Host '[!] Сборка полного установщика не удалась'; exit 1 }
          Get-ChildItem dist\Ekrannik-Full-Setup*.exe | ForEach-Object { Write-Host ('[OK] ' + $_.Name + '  ' + [math]::Round($_.Length/1MB,2) + ' MB') }

      - name: Sign FULL installer with own certificate
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfxBytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'sign-full.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:SIGN_PFX_PASSWORD, 'Exportable,PersistKeySet')
          $exe = Get-ChildItem 'dist\Ekrannik-Full-Setup*.exe' | Select-Object -First 1
          $sig = Set-AuthenticodeSignature -FilePath $exe.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host ('[OK] Signed: ' + $exe.FullName + ' -> ' + $sig.Status)

      - name: Mark folder as DEMO
        shell: pwsh
        run: |
          # Делаем папку ДЕМО: кладём demo.flag рядом с .exe → демо 3 дня.
          New-Item -ItemType File -Path 'dist\Ekrannik\demo.flag' -Force | Out-Null
          Write-Host '[OK] demo.flag добавлен — установщик и zip ниже = ДЕМО'

      - name: Package DEMO folder into ZIP
        shell: pwsh
        run: |
          $zip = 'dist\Ekrannik.zip'
          Compress-Archive -Path 'dist\Ekrannik' -DestinationPath $zip -Force
          Write-Host ('[OK] ' + $zip)
          Get-ChildItem dist\*.zip | ForEach-Object { Write-Host ('   ' + $_.Name + '  ' + [math]::Round($_.Length/1MB,2) + ' MB') }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          # Главный exe с кириллическим именем (строим из кодов символов)
          $exeName = 'Ekrannik.exe'
          $appTitle = 'Ekrannik'

          # Собираем .iss скрипт построчно (без here-string, чтобы не ломать YAML)
          $lines = @(
            '[Setup]',
            "AppName=$appTitle",
            'AppVersion=1.0.0',
            'AppPublisher=Evgeniy Mamonov',
            'DefaultDirName={autopf}\Ekrannik',
            "DefaultGroupName=$appTitle",
            'DisableProgramGroupPage=yes',
            "UninstallDisplayIcon={app}\$exeName",
            'OutputDir=dist',
            'OutputBaseFilename=Ekrannik-Setup',
            'SetupIconFile=dist\Ekrannik\mamonov_icon.ico',
            'Compression=lzma2',
            'SolidCompression=yes',
            'WizardStyle=modern',
            'PrivilegesRequired=lowest',
            '',
            '[Languages]',
            'Name: "en"; MessagesFile: "compiler:Default.isl"',
            'Name: "ru"; MessagesFile: "compiler:Languages\Russian.isl"',
            '',
            '[Tasks]',
            'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"',
            '',
            '[InstallDelete]',
            'Type: files; Name: "{app}\demo.flag"',
            '',
            '[Files]',
            'Source: "dist\Ekrannik\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs',
            '',
            '[Icons]',
            "Name: `"{group}\$appTitle`"; Filename: `"{app}\$exeName`"",
            "Name: `"{autodesktop}\$appTitle`"; Filename: `"{app}\$exeName`"; Tasks: desktopicon",
            '',
            '[Run]',
            "Filename: `"{app}\$exeName`"; Description: `"{cm:LaunchProgram,$appTitle}`"; Flags: nowait postinstall skipifsilent"
          )
          $iss = $lines -join "`r`n"
          $utf8bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText("$PWD\installer.iss", $iss, $utf8bom)

          # Находим ISCC.exe (Inno Setup предустановлен на windows-latest)
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host '[i] Inno Setup не найден — ставлю через choco'
            choco install innosetup -y --no-progress
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          & $iscc 'installer.iss'
          if ($LASTEXITCODE -ne 0) { Write-Host '[!] Сборка установщика не удалась'; exit 1 }
          Get-ChildItem dist\*.exe | ForEach-Object { Write-Host ('[OK] ' + $_.Name + '  ' + [math]::Round($_.Length/1MB,2) + ' MB') }

      - name: Sign installer with own certificate
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfxBytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:SIGN_PFX_PASSWORD, 'Exportable,PersistKeySet')
          $exe = Get-ChildItem 'dist\Ekrannik-Setup*.exe' | Select-Object -First 1
          $sig = Set-AuthenticodeSignature -FilePath $exe.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host ('[OK] Signed: ' + $exe.FullName + ' -> ' + $sig.Status)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-Nuitka-Folder
          path: |
            dist/*.zip
            dist/Ekrannik-Setup*.exe
            dist/Ekrannik-Full-Setup*.exe
          if-no-files-found: error

      - name: Publish to rolling release (auto-build-nuitka)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-nuitka
          name: "\u0410\u0432\u0442\u043e\u0441\u0431\u043e\u0440\u043a\u0430 Nuitka \u2014 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u044f\u044f \u0432\u0435\u0440\u0441\u0438\u044f"
          body: "\u0410\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0441\u0431\u043e\u0440\u043a\u0430 \u0447\u0435\u0440\u0435\u0437 Nuitka. \u041e\u0431\u043d\u043e\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u043f\u0440\u0438 \u043a\u0430\u0436\u0434\u043e\u0439 \u0441\u0431\u043e\u0440\u043a\u0435."
          files: |
            dist/*.zip
            dist/Ekrannik-Setup*.exe
            dist/Ekrannik-Full-Setup*.exe
          make_latest: true
