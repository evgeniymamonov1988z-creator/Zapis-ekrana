name: Build Windows EXE (Nuitka)
# build trigger: 2026-10-15 permanent-sign

# Сборка .exe через Nuitka на Windows.
# Nuitka компилирует Python в настоящий машинный код —
# это часто даёт меньше ложных срабатываний антивирусов, чем PyInstaller.

on:
  workflow_dispatch:        # кнопка "Запустить" вручную
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka==2.4.8
          pip install -r requirements.txt

      - name: Prepare embedded ffmpeg
        shell: pwsh
        run: |
          # ffmpeg.exe (163 МБ) не влезает в лимит GitHub 100 МБ на файл,
          # поэтому в репозитории лежит bin/ffmpeg.7z (~43 МБ).
          # Распаковываем его в bin/ -> Nuitka вшивает внутрь установщика,
          # и при первом запуске НИЧЕГО не скачивается, интернет не нужен.
          if (Test-Path 'bin\ffmpeg.7z') {
            New-Item -ItemType Directory -Path 'bin' -Force | Out-Null
            7z x 'bin\ffmpeg.7z' '-obin' -y | Out-Null
            if (Test-Path 'bin\ffmpeg.exe') {
              Write-Host ('[OK] ffmpeg.exe распакован: ' + [math]::Round((Get-Item 'bin\ffmpeg.exe').Length/1MB,1) + ' MB')
            } else {
              Write-Host '[!] 7z не дал bin\ffmpeg.exe'
              exit 1
            }
          } else {
            Write-Host '[!] bin\ffmpeg.7z отсутствует — программа будет скачивать ffmpeg'
          }

      - name: Build EXE with Nuitka
        shell: pwsh
        run: |
          $args = @(
            '--standalone',
            '--assume-yes-for-downloads',
            '--windows-console-mode=disable',
            '--enable-plugin=tk-inter',
            '--windows-icon-from-ico=mamonov_icon.ico',
            # Metadata inside the .exe (empty fields look suspicious to AV)
            '--company-name=Evgeniy Mamonov',
            '--product-name=Ekrannik (Screen Recorder)',
            '--file-description=Ekrannik - Screen Recorder by Evgeniy Mamonov',
            '--file-version=1.0.0.0',
            '--product-version=1.0.0.0',
            '--copyright=Copyright (c) Evgeniy Mamonov. All rights reserved.',
            '--trademarks=Ekrannik (TM) Evgeniy Mamonov',
            '--include-data-files=updater.pyw=updater.pyw',
            '--include-data-files=mamonov_icon.ico=mamonov_icon.ico',
            '--output-filename=Ekrannik.exe',
            '--output-dir=dist'
          )
          # PyAudioWPatch импортируется лениво внутри функций — форсируем включение
          # всего пакета, иначе Nuitka не положит его в сборку (нужен для звука: микрофон + системный).
          python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('pyaudiowpatch') else 1)"
          if ($LASTEXITCODE -eq 0) {
            Write-Host '[OK] PyAudioWPatch (звук) будет включён'
            $args += '--include-package=pyaudiowpatch'
          } else {
            Write-Host '[i] pyaudiowpatch не найден — пропускаю (запись пойдёт без звука)'
          }
          if (Test-Path 'bin\ffmpeg.exe') {
            Write-Host '[OK] ffmpeg.exe будет встроен в .exe'
            $args += '--include-data-dir=bin=bin'
          } else {
            Write-Host '[!] ffmpeg.exe нет в bin\ — сборка без движка, программа будет его скачивать'
            exit 1
          }
          python -m nuitka @args screen_recorder.pyw

      - name: Rename folder and main EXE to Russian demo name
        shell: pwsh
        run: |
          # Nuitka standalone кладёт результат в dist\screen_recorder.dist
          $distDir = 'dist\screen_recorder.dist'
          if (-not (Test-Path $distDir)) {
            Write-Host '[!] Папка сборки не найдена:' $distDir
            Get-ChildItem dist | Select-Object -First 30
            exit 1
          }
          # Переименуем папку в имя бренда
          Rename-Item -LiteralPath $distDir -NewName 'Ekrannik' -Force
          $newDir = 'dist\Ekrannik'
          Write-Host ('[OK] ' + $newDir + '\Ekrannik.exe')

      - name: Sign main EXE with own certificate
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfxBytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:SIGN_PFX_PASSWORD, 'Exportable,PersistKeySet')
          $exe = Get-ChildItem 'dist\Ekrannik\*.exe' | Select-Object -First 1
          $sig = Set-AuthenticodeSignature -FilePath $exe.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host ('[OK] Signed: ' + $exe.FullName + ' -> ' + $sig.Status)

      - name: Build FULL installer with Inno Setup
        continue-on-error: true
        shell: pwsh
        run: |
          # Установщик ПОЛНОЙ версии. Кладём явную метку full.flag —
          # программа считает себя полной только при наличии этой метки.
          $exeName = 'Ekrannik.exe'
          $appTitle = 'Ekrannik'
          New-Item -ItemType File -Path 'full.flag' -Force | Out-Null
          $lines = @(
            '[Setup]',
            "AppName=$appTitle",
            'AppVersion=1.0.0',
            'AppPublisher=Evgeniy Mamonov',
            'DefaultDirName={autopf}\Ekrannik',
            "DefaultGroupName=$appTitle",
            'DisableProgramGroupPage=yes',
            "UninstallDisplayIcon={app}\$exeName",
            'OutputDir=dist',
            'OutputBaseFilename=Ekrannik-Full-Setup',
            'SetupIconFile=dist\Ekrannik\mamonov_icon.ico',
            'Compression=lzma2',
            'SolidCompression=yes',
            'WizardStyle=modern',
            'PrivilegesRequired=lowest',
            'ShowLanguageDialog=no',
            '',
            '[Languages]',
            'Name: "en"; MessagesFile: "compiler:Default.isl"',
            'Name: "ru"; MessagesFile: "compiler:Languages\Russian.isl"',
            '',
            '[CustomMessages]',
            'en.AppShortcut=Ekrannik',
            'ru.AppShortcut=Экранник',
            '',
            '[Tasks]',
            'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"',
            '',
            '; demo.flag НЕ удаляем через [InstallDelete] — там нельзя проверить',
            '; наличие license_AE.dat. Снимаем демо в [Code] только когда лицензии нет.',
            '',
            '[Files]',
            'Source: "full.flag"; DestDir: "{app}"; Flags: ignoreversion',
            'Source: "dist\Ekrannik\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs',
            '',
            '[Icons]',
            "Name: `"{group}\{cm:AppShortcut}`"; Filename: `"{app}\$exeName`"",
            "Name: `"{autodesktop}\{cm:AppShortcut}`"; Filename: `"{app}\$exeName`"; Tasks: desktopicon",
            '',
            '[Run]',
            "Filename: `"{app}\$exeName`"; Description: `"{cm:LaunchProgram,$appTitle}`"; Flags: nowait postinstall skipifsilent",
            '',
            '[Code]',
            'function InitializeSetup(): Boolean;',
            'begin',
            '  Result := True;',
            'end;',
            '',
            'procedure CurStepChanged(CurStep: TSetupStep);',
            'var',
            '  DemoFlag, LicFile: String;',
            'begin',
            '  if CurStep = ssInstall then',
            '  begin',
            "    LicFile := ExpandConstant('{app}\license_AE.dat');",
            "    DemoFlag := ExpandConstant('{app}\demo.flag');",
            '    // Снимаем демо только если лицензии рядом нет: после активации',
            '    // ключом полная версия не должна слетать при переустановке.',
            '    if not FileExists(LicFile) then',
            '      DeleteFile(DemoFlag);',
            '  end;',
            'end;'
          )
          $iss = $lines -join "`r`n"
          $utf8bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText("$PWD\installer-full.iss", $iss, $utf8bom)
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host '[i] Inno Setup не найден — ставлю через choco'
            choco install innosetup -y --no-progress
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          & $iscc 'installer-full.iss'
          if ($LASTEXITCODE -ne 0) { Write-Host '[!] Сборка полного установщика не удалась'; exit 1 }
          Get-ChildItem dist\Ekrannik-Full-Setup*.exe | ForEach-Object { Write-Host ('[OK] ' + $_.Name + '  ' + [math]::Round($_.Length/1MB,2) + ' MB') }

      - name: Sign FULL installer with own certificate
        if: ${{ hashFiles('dist/Ekrannik-Full-Setup*.exe') != '' }}
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfxBytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'sign-full.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:SIGN_PFX_PASSWORD, 'Exportable,PersistKeySet')
          $exe = Get-ChildItem 'dist\Ekrannik-Full-Setup*.exe' | Select-Object -First 1
          $sig = Set-AuthenticodeSignature -FilePath $exe.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host ('[OK] Signed: ' + $exe.FullName + ' -> ' + $sig.Status)

      - name: Mark folder as DEMO
        shell: pwsh
        run: |
          # Делаем папку ДЕМО: кладём demo.flag рядом с .exe → демо 3 дня.
          New-Item -ItemType File -Path 'dist\Ekrannik\demo.flag' -Force | Out-Null
          Remove-Item 'dist\Ekrannik\full.flag' -ErrorAction SilentlyContinue
          New-Item -ItemType File -Path 'demo.flag' -Force | Out-Null
          Write-Host '[OK] demo.flag добавлен — установщик ниже = ДЕМО'

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          # Главный exe с кириллическим именем (строим из кодов символов)
          $exeName = 'Ekrannik.exe'
          $appTitle = 'Ekrannik'

          # Собираем .iss скрипт построчно (без here-string, чтобы не ломать YAML)
          $lines = @(
            '[Setup]',
            "AppName=$appTitle",
            'AppVersion=1.0.0',
            'AppPublisher=Evgeniy Mamonov',
            'DefaultDirName={autopf}\Ekrannik',
            "DefaultGroupName=$appTitle",
            'DisableProgramGroupPage=yes',
            "UninstallDisplayIcon={app}\$exeName",
            'OutputDir=dist',
            'OutputBaseFilename=Ekrannik-Setup',
            'SetupIconFile=dist\Ekrannik\mamonov_icon.ico',
            'Compression=lzma2',
            'SolidCompression=yes',
            'WizardStyle=modern',
            'PrivilegesRequired=lowest',
            'ShowLanguageDialog=no',
            '',
            '[Languages]',
            'Name: "en"; MessagesFile: "compiler:Default.isl"',
            'Name: "ru"; MessagesFile: "compiler:Languages\Russian.isl"',
            '',
            '[CustomMessages]',
            'en.AppShortcut=Ekrannik',
            'ru.AppShortcut=Экранник',
            '',
            '[Tasks]',
            'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"',
            '',
            '; демо-установщик НЕ удаляет demo.flag и license_AE.dat — иначе',
            '; повторная установка демо снимала бы оплаченную активацию.',
            '; demo.flag ставится только там, где файла лицензии нет.',
            '',
            '[Files]',
            'Source: "demo.flag"; DestDir: "{app}"; Flags: ignoreversion',
            'Source: "dist\Ekrannik\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs',
            '',
            '[Icons]',
            "Name: `"{group}\{cm:AppShortcut}`"; Filename: `"{app}\$exeName`"",
            "Name: `"{autodesktop}\{cm:AppShortcut}`"; Filename: `"{app}\$exeName`"; Tasks: desktopicon",
            '',
            '[Run]',
            "Filename: `"{app}\$exeName`"; Description: `"{cm:LaunchProgram,$appTitle}`"; Flags: nowait postinstall skipifsilent",
            '',
            '[Code]',
            'procedure CurStepChanged(CurStep: TSetupStep);',
            'var',
            '  DemoFlag, LicFile: String;',
            'begin',
            '  if CurStep = ssPostInstall then',
            '  begin',
            "    LicFile := ExpandConstant('{app}\license_AE.dat');",
            "    DemoFlag := ExpandConstant('{app}\demo.flag');",
            '    // Демо-метку ставим только там, где лицензии нет.',
            '    // Поэтому демо поверх оплаченной версии активацию не снимает.',
            '    if FileExists(LicFile) then',
            '      DeleteFile(DemoFlag);',
            '  end;',
            'end;'
          )
          $iss = $lines -join "`r`n"
          $utf8bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText("$PWD\installer.iss", $iss, $utf8bom)

          # Находим ISCC.exe (Inno Setup предустановлен на windows-latest)
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host '[i] Inno Setup не найден — ставлю через choco'
            choco install innosetup -y --no-progress
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          & $iscc 'installer.iss'
          if ($LASTEXITCODE -ne 0) { Write-Host '[!] Сборка установщика не удалась'; exit 1 }
          Get-ChildItem dist\*.exe | ForEach-Object { Write-Host ('[OK] ' + $_.Name + '  ' + [math]::Round($_.Length/1MB,2) + ' MB') }

      - name: Sign installer with own certificate
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfxBytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:SIGN_PFX_PASSWORD, 'Exportable,PersistKeySet')
          $exe = Get-ChildItem 'dist\Ekrannik-Setup*.exe' | Select-Object -First 1
          $sig = Set-AuthenticodeSignature -FilePath $exe.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host ('[OK] Signed: ' + $exe.FullName + ' -> ' + $sig.Status)

      - name: Build activation key (Ekrannik-Unlock)
        shell: pwsh
        run: |
          # Ключ активации — маленький C-файл (act_key.c), сборка компилятором из Windows.
          # Ставит license_AE.dat, поэтому демо-установка поверх больше не снимает активацию.
          # build_key.ps1 запускаем как есть: через powershell -File он ломался на
          # парсере («string is missing the terminator»). $LASTEXITCODE не используем:
          # после Start-Process он может остаться от чужой команды и рабочий ключ
          # помечался как «не собрался». Проверяем сам файл.
          pwsh -File tools/build_key.ps1
          if (-not (Test-Path 'dist\Ekrannik-Unlock.exe')) { Write-Host '[!] Нет dist\Ekrannik-Unlock.exe'; exit 1 }
          $k = Get-Item 'dist\Ekrannik-Unlock.exe'
          Write-Host ('[OK] ' + $k.Name + '  ' + [math]::Round($k.Length/1KB,1) + ' KB')
          $pfxBytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:SIGN_PFX_PASSWORD, 'Exportable,PersistKeySet')
          $sig = Set-AuthenticodeSignature -FilePath $k.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host ('[OK] Signed key -> ' + $sig.Status)
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-Nuitka-Folder
          path: |
            dist/Ekrannik-Setup*.exe
            dist/Ekrannik-Unlock.exe
          if-no-files-found: error

      - name: Publish to rolling release (auto-build-nuitka)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-nuitka
          name: "\u0410\u0432\u0442\u043e\u0441\u0431\u043e\u0440\u043a\u0430 Nuitka \u2014 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u044f\u044f \u0432\u0435\u0440\u0441\u0438\u044f"
          body: "\u0410\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0441\u0431\u043e\u0440\u043a\u0430 \u0447\u0435\u0440\u0435\u0437 Nuitka. \u041e\u0431\u043d\u043e\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u043f\u0440\u0438 \u043a\u0430\u0436\u0434\u043e\u0439 \u0441\u0431\u043e\u0440\u043a\u0435."
          files: |
            dist/Ekrannik-Setup*.exe
            dist/Ekrannik-Full-Setup*.exe
            dist/Ekrannik-Unlock.exe
          make_latest: true
      - name: Upload installers to site (FTP)
        shell: pwsh
        continue-on-error: false
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not $env:FTP_PASS) { Write-Host '[!] Нет секрета FTP_PASSWORD'; exit 1 }
          # FTP_HOST в секретах может быть как '141.8.192.25', так и
          # 'ftp://141.8.192.25' — раньше из-за этого выходило 'ftp://ftp://...'
          # и все отправки падали с 'The requested URI is invalid for this FTP command'.
          $host_ = $env:FTP_HOST; if (-not $host_) { $host_ = '141.8.192.25' }
          $host_ = ($host_ -replace '^[a-zA-Z]+://', '').Trim().TrimEnd('/')
          $user_ = $env:FTP_USER; if (-not $user_) { $user_ = 'a1306338' }
          $baseUrl = 'ftp://' + $host_ + '/'
          if (-not $baseUrl.EndsWith('/')) { $baseUrl = $baseUrl + '/' }
          Write-Host ('[i] FTP: ' + $baseUrl + ' (user ' + $user_ + ')')
          function Get-RemoteSize($remote) {
            $uri = $baseUrl + $remote
            $rq = [System.Net.FtpWebRequest]::Create($uri)
            $rq.Credentials = New-Object System.Net.NetworkCredential($user_, $env:FTP_PASS)
            $rq.Method = [System.Net.WebRequestMethods+Ftp]::GetFileSize
            $rq.UsePassive = $true
            $rq.Timeout = 30000
            try { return [int64]$rq.GetResponse().ContentLength } catch { return -1 }
          }
          function Try-Put($remote, $local) {
            $size = (Get-Item $local).Length
            $uri = $baseUrl + $remote
            $rq = [System.Net.FtpWebRequest]::Create($uri)
            $rq.Credentials = New-Object System.Net.NetworkCredential($user_, $env:FTP_PASS)
            $rq.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
            $rq.UseBinary = $true
            $rq.UsePassive = $true
            $rq.Timeout = 300000
            $rq.KeepAlive = $false
            try {
              $fs = [System.IO.File]::OpenRead($local)
              $rq.ContentLength = $size
              $st = $rq.GetRequestStream()
              $fs.CopyTo($st)
              $st.Close(); $fs.Close()
              $rq.GetResponse().Close()
            } catch {
              Write-Host ('[!] ошибка отправки ' + $remote + ': ' + $_.Exception.Message)
              return $false
            }
            $now = Get-RemoteSize $remote
            Write-Host ('[i] ' + $remote + ' -> на сервере ' + $now + ' из ' + $size + ' байт')
            if ($now -eq $size) {
              Write-Host ('[OK] залито и проверено: ' + $remote + '  ' + [math]::Round($size/1MB,2) + ' MB')
              return $true
            }
            Write-Host ('[!] РАЗМЕР НЕ СОВПАЛ: ' + $remote)
            return $false
          }
          $okAll = $true
          $files = @()
          foreach ($pat in @('dist/Ekrannik-Setup.exe', 'dist/Ekrannik-Full-Setup.exe', 'dist/Ekrannik-Unlock.exe')) {
            $found = @(Get-ChildItem -Path $pat -ErrorAction SilentlyContinue)
            if ($found.Count -eq 0) { Write-Host ('[i] нет файла ' + $pat); $okAll = $false; continue }
            $files += $found
          }
          foreach ($f in $files) {
            $lp = $f.FullName; $name = $f.Name
            Write-Host ('[i] файл: ' + $name)
            $done = $false
            foreach ($dir in @('', 'files/')) {
              if ($done) { break }
              $done = Try-Put ($dir + $name) $lp
            }
            if (-not $done) { $okAll = $false }
          }
          if (-not $okAll) { Write-Host '[!] Не все файлы залиты'; exit 1 }
          Write-Host '[OK] Все установщики на сайте'


