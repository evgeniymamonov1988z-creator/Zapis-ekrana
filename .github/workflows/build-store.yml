name: Build Store EXE (Digiseller)
# МАГАЗИННАЯ сборка для Digiseller.
#
# Отличие от обычной (демо) сборки — внутрь кладётся скрытая
# метка edition_store.flag. С ней программа при первом запуске сама
# активирует компьютер (зовёт /api/activate.php) и становится полной.
# Обычная демо-сборка (build-nuitka.yml) этой метки НЕ имеет.
#
# Запускается ТОЛЬКО вручную (кнопка Run workflow), чтобы не тратить
# минуты сборки при каждом изменении кода.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka==2.4.8
          pip install -r requirements.txt

      - name: Create store marker
        shell: pwsh
        run: |
          # Метка магазинной сборки — ляжет рядом с .exe
          Set-Content -Path 'edition_store.flag' -Value 'digiseller' -NoNewline
          Write-Host '[OK] edition_store.flag создан'

      - name: Build EXE with Nuitka
        shell: pwsh
        run: |
          $args = @(
            '--standalone',
            '--assume-yes-for-downloads',
            '--windows-console-mode=disable',
            '--enable-plugin=tk-inter',
            '--windows-icon-from-ico=mamonov_icon.ico',
            '--company-name=Evgeniy Mamonov',
            '--product-name=Zapis ekrana (Screen Recorder)',
            '--file-description=Screen Recorder by Evgeniy Mamonov',
            '--file-version=1.0.0.0',
            '--product-version=1.0.0.0',
            '--copyright=Copyright (c) Evgeniy Mamonov. All rights reserved.',
            '--trademarks=Zapis ekrana (TM) Evgeniy Mamonov',
            '--include-data-files=updater.pyw=updater.pyw',
            '--include-data-files=mamonov_icon.ico=mamonov_icon.ico',
            '--include-data-files=edition_store.flag=edition_store.flag',
            '--output-filename=ScreenRecorder.exe',
            '--output-dir=dist'
          )
          python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('_sounddevice_data') else 1)"
          if ($LASTEXITCODE -eq 0) {
            Write-Host '[OK] PortAudio (_sounddevice_data) будет включён'
            $args += '--include-package-data=_sounddevice_data'
          } else {
            Write-Host '[i] _sounddevice_data не найден — пропускаю'
          }
          if (Test-Path 'bin\ffmpeg.exe') {
            Write-Host '[OK] ffmpeg.exe будет встроен в .exe'
            $args += '--include-data-dir=bin=bin'
          } else {
            Write-Host '[i] ffmpeg.exe нет в bin\ — программа скачает его при первом запуске'
          }
          python -m nuitka @args screen_recorder.pyw

      - name: Rename folder and main EXE to Russian name
        shell: pwsh
        run: |
          $distDir = 'dist\screen_recorder.dist'
          if (-not (Test-Path $distDir)) {
            Write-Host '[!] Папка сборки не найдена:' $distDir
            Get-ChildItem dist | Select-Object -First 30
            exit 1
          }
          Rename-Item -LiteralPath $distDir -NewName 'Zapis ekrana' -Force
          $newDir = 'dist\Zapis ekrana'
          # Главный .exe — русское имя (без приставки Demo — это полная магазинная)
          $c = [char[]](0x0417,0x0430,0x043F,0x0438,0x0441,0x044C,0x20,0x044D,0x043A,0x0440,0x0430,0x043D,0x0430)
          $name = (-join $c) + '.exe'
          Rename-Item -LiteralPath (Join-Path $newDir 'ScreenRecorder.exe') -NewName $name -Force
          Write-Host ('[OK] ' + $newDir + '\' + $name)

      - name: Sign main EXE with own certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Evgeniy Mamonov" -KeyUsage DigitalSignature -FriendlyName "Mamonov Code Signing" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(10)
          $exe = Get-ChildItem 'dist\Zapis ekrana\*.exe' | Select-Object -First 1
          $sig = Set-AuthenticodeSignature -FilePath $exe.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host ('[OK] Signed: ' + $exe.FullName + ' -> ' + $sig.Status)

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $c = [char[]](0x0417,0x0430,0x043F,0x0438,0x0441,0x044C,0x20,0x044D,0x043A,0x0440,0x0430,0x043D,0x0430)
          $exeName = (-join $c) + '.exe'       # Запись экрана.exe
          $appTitle = (-join $c)                # Запись экрана

          $lines = @(
            '[Setup]',
            "AppName=$appTitle",
            'AppVersion=1.0.0',
            'AppPublisher=Evgeniy Mamonov',
            'DefaultDirName={autopf}\Zapis ekrana',
            "DefaultGroupName=$appTitle",
            'DisableProgramGroupPage=yes',
            "UninstallDisplayIcon={app}\$exeName",
            'OutputDir=dist',
            'OutputBaseFilename=Ustanovka Zapis ekrana (Digiseller)',
            'SetupIconFile=dist\Zapis ekrana\mamonov_icon.ico',
            'Compression=lzma2',
            'SolidCompression=yes',
            'WizardStyle=modern',
            'PrivilegesRequired=lowest',
            '',
            '[Languages]',
            'Name: "ru"; MessagesFile: "compiler:Languages\Russian.isl"',
            '',
            '[Tasks]',
            'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"',
            '',
            '[Files]',
            'Source: "dist\Zapis ekrana\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs',
            '',
            '[Icons]',
            "Name: `"{group}\$appTitle`"; Filename: `"{app}\$exeName`"",
            "Name: `"{autodesktop}\$appTitle`"; Filename: `"{app}\$exeName`"; Tasks: desktopicon",
            '',
            '[Run]',
            "Filename: `"{app}\$exeName`"; Description: `"{cm:LaunchProgram,$appTitle}`"; Flags: nowait postinstall skipifsilent"
          )
          $iss = $lines -join "`r`n"
          $utf8bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText("$PWD\installer.iss", $iss, $utf8bom)

          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host '[i] Inno Setup не найден — ставлю через choco'
            choco install innosetup -y --no-progress
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          & $iscc 'installer.iss'
          if ($LASTEXITCODE -ne 0) { Write-Host '[!] Сборка установщика не удалась'; exit 1 }
          Get-ChildItem dist\*.exe | ForEach-Object { Write-Host ('[OK] ' + $_.Name + '  ' + [math]::Round($_.Length/1MB,2) + ' MB') }

      - name: Sign installer with own certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Evgeniy Mamonov" -KeyUsage DigitalSignature -FriendlyName "Mamonov Code Signing" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(10)
          $exe = Get-ChildItem 'dist\Ustanovka*.exe' | Select-Object -First 1
          $sig = Set-AuthenticodeSignature -FilePath $exe.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host ('[OK] Signed: ' + $exe.FullName + ' -> ' + $sig.Status)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-Store
          path: dist/Ustanovka*.exe
          if-no-files-found: error

      - name: Publish to rolling release (auto-build-store)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-store
          name: "Store build (Digiseller)"
          body: "Магазинная сборка для Digiseller: сама активирует компьютер при первом запуске. Не выкладывать в открытый доступ!"
          files: dist/Ustanovka*.exe
          make_latest: false
